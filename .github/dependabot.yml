# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions-deps:
        patterns:
          - "*"
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    groups:
      patch-minor:
        update-types: ["patch", "minor"]
        # 0.x "minor" releases do not follow semver guarantees. satteri
        # 0.10 -> 0.11 produced a dual install that failed astro check, and
        # satori once jumped 30 minors in one grouped PR. Keep these
        # rendering-critical packages as individual, reviewable PRs.
        exclude-patterns:
          - "satteri"
          - "satori"
          - "satori-html"
          - "katex"
          - "@astrojs/markdown-satteri"
          - "astro-expressive-code"
