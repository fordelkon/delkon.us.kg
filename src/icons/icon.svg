<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256" viewBox="-135 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">灰青绿与暖纸色的侧脸</title>
  <desc id="desc">复古印刷配色，保留侧脸、青绿眼睛、发束、陶橙色发饰及肩颈衣料细节。</desc>

  <!-- Muted pigment colors stay fixed on both site themes, like a printed badge. -->
  <defs>
    <!-- Clip the asset itself so favicons retain the same circular silhouette. -->
    <clipPath id="icon-circle">
      <circle cx="377" cy="512" r="512"/>
    </clipPath>
    <linearGradient id="skin" x1=".25" y1=".65" x2=".85" y2=".2">
      <stop stop-color="#f3ebdd"/>
      <stop offset=".58" stop-color="#f3ebdd"/>
      <stop offset="1" stop-color="#d1b59a"/>
    </linearGradient>

    <linearGradient id="forehead" x1="0" x2="1" y1="0" y2=".7">
      <stop stop-color="#c3a68b"/>
      <stop offset=".4" stop-color="#e4d3bb"/>
      <stop offset="1" stop-color="#f3ebdd"/>
    </linearGradient>

    <linearGradient id="neck" x1=".18" y1=".45" x2=".84" y2=".65">
      <stop stop-color="#f3ebdd"/>
      <stop offset=".34" stop-color="#c8aa8c"/>
      <stop offset=".51" stop-color="#c8aa8c"/>
      <stop offset=".78" stop-color="#eee2ce"/>
      <stop offset="1" stop-color="#f3ebdd"/>
    </linearGradient>

    <linearGradient id="shoulder" x1="0" y1=".15" x2=".6" y2=".55">
      <stop stop-color="#f6efdf"/>
      <stop offset=".15" stop-color="#e8d5b8"/>
      <stop offset=".28" stop-color="#cbb093"/>
      <stop offset=".41" stop-color="#f3ebdd"/>
      <stop offset="1" stop-color="#f3ebdd"/>
    </linearGradient>

    <linearGradient id="arm" x1="0" y1=".5" x2="1" y2=".7">
      <stop stop-color="#e1c9a9"/>
      <stop offset=".22" stop-color="#b7b7aa"/>
      <stop offset="1" stop-color="#93988c"/>
    </linearGradient>

    <linearGradient id="collar" x1="0" y1="0" x2="1" y2=".45">
      <stop stop-color="#d8d7c9"/>
      <stop offset=".4" stop-color="#b3b5a8"/>
      <stop offset="1" stop-color="#989e90"/>
    </linearGradient>

    <linearGradient id="iris" gradientUnits="userSpaceOnUse"
                    x1="250" y1="337" x2="257" y2="380">
      <stop stop-color="#293e35"/>
      <stop offset=".28" stop-color="#46695a"/>
      <stop offset=".68" stop-color="#729b83"/>
      <stop offset="1" stop-color="#b3cbb1"/>
    </linearGradient>

    <linearGradient id="eye-shade" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#817f78"/>
      <stop offset=".45" stop-color="#dfdacf"/>
      <stop offset="1" stop-color="#fffaed"/>
    </linearGradient>

    <radialGradient id="iris-light" cx=".48" cy=".8" r=".55">
      <stop stop-color="#bad6cb" stop-opacity=".75"/>
      <stop offset="1" stop-color="#a9c2b9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fold" x1="0" y1=".2" x2="1" y2=".8">
      <stop stop-color="#e8e7da"/>
      <stop offset=".37" stop-color="#b5b7aa"/>
      <stop offset=".68" stop-color="#939b8c"/>
      <stop offset="1" stop-color="#c0c4b5"/>
    </linearGradient>

    <linearGradient id="clip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#526b5e"/>
      <stop offset=".55" stop-color="#42594e"/>
      <stop offset="1" stop-color="#34483e"/>
    </linearGradient>

    <radialGradient id="blush">
      <stop stop-color="#c7ad98" stop-opacity=".38"/>
      <stop offset="1" stop-color="#c7ad98" stop-opacity="0"/>
    </radialGradient>

    <filter id="edge-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="faceclip">
      <use href="#face-shape"/>
    </clipPath>

    <clipPath id="shoulderclip">
      <use href="#shoulder-shape"/>
    </clipPath>

    <clipPath id="eyeclip">
      <path d="M211 359 Q245 337 289 335 Q279 354 259 367
               L232 384 Q222 373 211 359Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon-circle)">
  <!-- 背景与头发使用相同底色 -->
  <path fill="#829b93" d="M-135 0H889V1024H-135Z"/>

  <!-- 发饰 -->
  <g id="hair-accessories">
    <path fill="#6b7b75" d="M496 60 528 86 521 98 511 101 485 78Z"/>
    <path fill="#56635e" d="m499 64 26 23-8 11-6 1-22-21Z"/>
    <path fill="#f2ede1" d="m494 63 7 6-8 10-1 5-10 9-4-5 4-7-1-4Z"/>

    <path fill="url(#clip)" stroke="#363e3b"
          stroke-width="1.5" stroke-linejoin="round"
          d="m389 180 17-19 12-1 7 4-10 12 83 80 9 13-16 13-13-9-64-68Z"/>
    <path fill="#f9f4e8" d="m391 178 15-16 8-1-10 12Z"/>
    <path fill="#c87954"
