    <path d="M290 333q-17-3-48 7-30 8-40 31"
          stroke="#b08d75" stroke-width="3" opacity=".3"
          fill="none" filter="url(#edge-soft)"/>
    <path d="M193 511q4 5 11 5"
          stroke="#d4bfac" stroke-width="1.3" opacity=".4" fill="none"/>
