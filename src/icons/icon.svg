    <path d="M371 434Q360 463 373 484Q380 493 398 491
             Q381 498 370 484Q359 466 371 434Z"/>
    <path d="M430 416Q424 444 418 464L426 453
             Q423 472 425 484L433 465Q432 478 438 488L435 450Z"/>
