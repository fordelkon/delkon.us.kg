    <path d="M252 324q23 3 34 5"
          fill="none" stroke="#6f8079" stroke-width=".85"/>
    <path fill="#829b93" d="M232 315q31 3 53 10l-26-5Z"/>
  </g>

  <!-- 耳部 -->
  <g id="ear">
    <path fill="#f9f5e8" d="M421 306q15 6 24 25l3 26-10-14-8-21Z"/>
    <path fill="url(#forehead)"
          d="m407 357 27 31-6 15-14 12-18 4-5 22-15 22-7 10 5-24 18-45Z"/>
    <path fill="#fcf7ea" d="m412 372 20 16-8 18-26 10 7-26Z"/>
    <path fill="#bc9e88" opacity=".55"
          d="m407 360 5 11-9 25-8 21-4 23-16 22 13-27 9-38Z"/>
    <path d="m426 408-12 7-18 4-4 20-17 25"
          fill="none" stroke="#5d5b57" stroke-width="1.05"/>
  </g>

